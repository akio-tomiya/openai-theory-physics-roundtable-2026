<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102940">
    <meta name="description" content="学習物理学・緊急オンライン座談会『OpenAI論文と理論物理』。2026年10月12日（月）20:00–21:00頃、オンライン開催。">
    <title>OpenAI論文と理論物理｜学習物理学・緊急オンライン座談会</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Hiragino Sans", sans-serif;
        font-synthesis: none;
        --ink: #102940;
        --muted: #52677a;
        --blue: #175d80;
        --line: #cbd8dd;
        --paper: #f7f8f5;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.7;
      }

      a { color: inherit; text-underline-offset: .25em; }

      a:focus-visible { outline: 3px solid #cc7c3a; outline-offset: 5px; }

      .wrap { width: min(100% - 3rem, 1100px); margin-inline: auto; }

      .hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 620px;
        padding: 40px 0 76px;
        background: #102940;
        color: #fff;
      }

      .hero::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: min(950px, 110vw);
        aspect-ratio: 1;
        right: max(-335px, calc((100vw - 1100px)/2 - 335px));
        top: -260px;
        border: 1px solid rgba(196, 226, 227, .23);
        border-radius: 50%;
        box-shadow: 0 0 0 105px rgba(0, 0, 0, 0),
                    0 0 0 106px rgba(196, 226, 227, .15),
                    0 0 0 230px rgba(0, 0, 0, 0),
                    0 0 0 231px rgba(196, 226, 227, .10);
      }

      .hero::after {
        content: "";
        position: absolute;
        z-index: -1;
        width: 12px;
        height: 12px;
        right: 19%;
        top: 24%;
        border-radius: 50%;
        background: #f0b46f;
        box-shadow: 180px 195px 0 -3px #add9d5, -205px 320px 0 -4px #add9d5;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding-bottom: 84px;
        border-bottom: 1px solid rgba(255, 255, 255, .22);
        font-size: .8rem;
        font-weight: 700;
        letter-spacing: .16em;
      }

      .topline span:last-child { color: #badbdc; }

      .eyebrow {
        margin: 68px 0 23px;
        color: #badbdc;
        font-size: .82rem;
        font-weight: 700;
        letter-spacing: .17em;
      }

      h1 {
        max-width: 890px;
        margin: 0;
        font-size: clamp(2.7rem, 6.6vw, 5.7rem);
        font-weight: 800;
        letter-spacing: -.065em;
        line-height: 1.23;
      }

      h1 span { display: block; }

      .info {
        position: relative;
        z-index: 1;
        margin-top: -58px;
        display: grid;
        grid-template-columns: 1.45fr .65fr;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 20px 52px rgba(16, 41, 64, .09);
      }

      .info > div { padding: 27px 38px 30px; }
      .info > div + div { border-left: 1px solid var(--line); }

      .label {
        margin: 0 0 6px;
        color: var(--blue);
        font-size: .76rem;
        font-weight: 800;
        letter-spacing: .14em;
      }

      .date {
        margin: 0;
        font-size: clamp(1.35rem, 2.7vw, 2rem);
        font-weight: 800;
        letter-spacing: -.04em;
        line-height: 1.4;
      }

      .date small { font-size: .53em; letter-spacing: 0; white-space: nowrap; }

      .section { padding: 100px 0 106px; }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        margin-bottom: 26px;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.65rem, 3.5vw, 2.55rem);
        letter-spacing: -.05em;
        line-height: 1.35;
      }

      .section-heading p {
        margin: 0;
        color: var(--muted);
        font-size: .88rem;
      }

      .people {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .people li {
        display: flex;
        align-items: end;
        min-height: 154px;
        padding: 27px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: clamp(1.36rem, 2.2vw, 1.72rem);
        font-weight: 700;
        letter-spacing: -.035em;
      }

      .more {
        margin: 25px 0 0;
        color: var(--blue);
        font-size: 1rem;
        font-weight: 700;
      }

      .grant {
        padding: 44px 0 53px;
        border-top: 1px solid var(--line);
        background: #edf2f1;
      }

      .grant-name {
        max-width: 820px;
        margin: 10px 0 0;
        font-size: clamp(1rem, 1.75vw, 1.24rem);
        font-weight: 700;
        line-height: 1.65;
      }

      .grant a { text-decoration-color: #89aab9; }

      @media (max-width: 700px) {
        .wrap { width: min(100% - 2rem, 1100px); }
        .hero { min-height: 520px; padding-top: 25px; }
        .hero::before { right: -440px; top: -180px; }
        .topline { padding-bottom: 57px; font-size: .66rem; }
        .eyebrow { margin-top: 67px; }
        .info { grid-template-columns: 1fr; margin-top: -43px; }
        .info > div { padding: 22px 24px; }
        .info > div + div { border-left: 0; border-top: 1px solid var(--line); }
        .section { padding: 75px 0 82px; }
        .section-heading { display: block; }
        .section-heading p { margin-top: 8px; }
        .people { grid-template-columns: 1fr; gap: 9px; }
        .people li { min-height: 92px; padding: 18px 23px; }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <div class="topline"><span>学習物理学</span><span>ONLINE ROUNDTABLE</span></div>
        <p class="eyebrow">緊急オンライン座談会</p>
        <h1><span>OpenAI論文と</span><span>理論物理</span></h1>
      </div>
    </header>

    <main>
      <div class="wrap info" aria-label="開催情報">
        <div>
          <p class="label">DATE &amp; TIME</p>
          <p class="date"><time datetime="2026-10-12T20:00:00+09:00">2026年10月12日（月）20:00–21:00頃 <small>JST</small></time></p>
        </div>
        <div>
          <p class="label">FORMAT</p>
          <p class="date">オンライン</p>
        </div>
      </div>

      <section class="section wrap" aria-labelledby="people-title">
        <div class="section-heading">
          <h2 id="people-title">参加予定者</h2>
          <p>敬称略</p>
        </div>
        <ul class="people">
          <li>橋本幸士</li>
          <li>樺島祥介</li>
          <li>富谷昭夫</li>
        </ul>
        <p class="more">ほか、参加者を追加予定</p>
      </section>
    </main>

    <footer class="grant">
      <div class="wrap">
        <p class="label">科研費・学術変革領域研究（A）</p>
        <p class="grant-name"><a href="https://mlphys.scphys.kyoto-u.ac.jp/">「学習物理学」の創成－機械学習と物理学の融合新領域による基礎物理学の変革</a></p>
      </div>
    </footer>
  </body>
</html>
